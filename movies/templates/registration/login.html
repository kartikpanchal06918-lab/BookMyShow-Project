<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | BOOKMYSHOW</title><style>body{font-family:Arial;background:#f5f6fa;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:28px;border-radius:12px;width:min(420px,92%)}h1{color:#f84464}input{display:block;width:100%;padding:10px;margin:8px 0 15px;box-sizing:border-box;border:1px solid #ccc;border-radius:5px}button{background:#f84464;color:white;padding:11px 16px;border:0;border-radius:5px;cursor:pointer}a{color:#f84464}</style></head><body><div class="box"><h1>BOOKMYSHOW</h1><h2>Login</h2><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button type="submit">Login</button></form><p>New to BOOKMYSHOW? <a href="{% url 'register' %}">Create an account</a></p><p><a href="{% url 'home' %}">Back to home</a></p></div></body></html>
