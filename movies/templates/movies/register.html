<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKMYSHOW | Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #30205e, #090d27 70%);
            color: white;
        }

        .register-box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #17162f;
            border: 1px solid #49346d;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(161, 59, 206, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 36px;
            color: white;
        }

        .tagline {
            text-align: center;
            color: #ff456d;
            margin: 10px 0 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #51436c;
            border-radius: 8px;
            background: #24213e;
            color: white;
            outline: none;
        }

        .helptext, ul {
            color: #b9b5ca;
            font-size: 12px;
            margin-top: 7px;
        }

        ul {
            padding-left: 18px;
        }

        .errorlist {
            color: #ff7189;
            margin-top: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #ed315c, #a13bce);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }

        a {
            color: #ff456d;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h1>BOOKMYSHOW</h1>
        <p class="tagline">Simple Booking, Perfect Seating</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</body>
</html>
